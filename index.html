<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>摘要核验 Case Study</title>
  <meta name="description" content="10 个摘要事实性数据集各 10 条样本：原文、摘要、原生标注，以及数据集本身的问题。">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <strong>摘要核验 Case Study</strong>
      <span>10 个数据集 × 10 条 · 看数据集本身有什么问题</span>
    </div>
    <nav class="tabs" aria-label="视图">
      <a href="#view=overview" data-view="overview">总览</a>
      <a href="#view=reader" data-view="reader">逐条阅读</a>
    </nav>
    <button type="button" id="themeBtn" class="ghost" aria-label="切换配色">配色：自动</button>
  </header>

  <main id="overview" class="view overview" hidden>
    <div class="overview-inner" id="overviewInner"><p class="loading">正在加载数据…</p></div>
  </main>

  <main id="reader" class="view reader" hidden>
    <div class="reader-grid">
      <aside class="sidebar" aria-label="样本列表">
        <button type="button" id="filterToggle" class="filter-toggle" aria-expanded="true" aria-controls="filters">筛选</button>
        <div class="filters" id="filters">
          <label>数据集<select id="fDs"></select></label>
          <label>原生标注分组<select id="fState"></select></label>
          <label>生成模型<select id="fGen"></select></label>
          <label>自动问题标记<select id="fFlag"></select></label>
          <label>人工观察<select id="fTag"></select></label>
          <label>排序<select id="fSort">
            <option value="order">阅读顺序</option>
            <option value="flags">问题标记多→少</option>
            <option value="d-desc">D 长→短</option>
            <option value="s-desc">S 长→短</option>
          </select></label>
          <label class="wide">全文搜索<input id="fQ" type="search" placeholder="搜 D、S、标注、模型或编号"></label>
          <div class="filter-row">
            <label class="check"><input id="fUnread" type="checkbox">只看未读</label>
            <button type="button" id="resetBtn" class="ghost small">重置筛选</button>
          </div>
        </div>
        <div class="list-meta">
          <span id="listCount"></span>
          <span class="note-tools">
            <button type="button" id="exportBtn" class="ghost small">导出笔记</button>
            <button type="button" id="importBtn" class="ghost small">导入笔记</button>
            <input id="importFile" type="file" accept="application/json,.json" hidden>
          </span>
        </div>
        <div class="list" id="list" role="listbox" aria-label="样本"></div>
      </aside>

      <section class="detail" id="detail" aria-live="polite"></section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
